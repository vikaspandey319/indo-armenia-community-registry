<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.8"/>

  <!-- Tricolor Top Ring Accent -->
  <path d="M 64 64 A 40 40 0 0 1 128 64" fill="none" stroke="#FF9933" stroke-width="8" stroke-linecap="round"/>
  <path d="M 384 64 A 40 40 0 0 1 448 64" fill="none" stroke="#D90012" stroke-width="8" stroke-linecap="round"/>

  <!-- Flag Poles (crossed) -->
  <g stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" filter="url(#shadow)">
    <!-- Left Pole (to top-right) -->
    <line x1="160" y1="360" x2="350" y2="130" />
    <!-- Right Pole (to top-left) -->
    <line x1="352" y1="360" x2="162" y2="130" />
  </g>
  <!-- Pole finials (gold balls) -->
  <circle cx="162" cy="130" r="10" fill="url(#gold)"/>
  <circle cx="350" cy="130" r="10" fill="url(#gold)"/>

  <!-- Left Flag: Indian Tricolour (waving to left) -->
  <g filter="url(#shadow)">
    <!-- Saffron stripe -->
    <path d="M 190 162 C 160 152 135 172 105 162 L 105 194 C 135 204 160 184 190 194 Z" fill="#FF9933"/>
    <!-- White stripe -->
    <path d="M 190 194 C 160 184 135 204 105 194 L 105 226 C 135 236 160 216 190 226 Z" fill="#FFFFFF"/>
    <!-- Green stripe -->
    <path d="M 190 226 C 160 216 135 236 105 226 L 105 258 C 135 268 160 248 190 258 Z" fill="#138808"/>
    <!-- Ashoka Chakra on white stripe -->
    <circle cx="147" cy="210" r="11" fill="none" stroke="#000080" stroke-width="2"/>
    <circle cx="147" cy="210" r="3" fill="#000080"/>
  </g>

  <!-- Right Flag: Armenian Tricolor (waving to right) -->
  <g filter="url(#shadow)">
    <!-- Red stripe -->
    <path d="M 322 162 C 352 152 377 172 407 162 L 407 194 C 377 204 352 184 322 194 Z" fill="#D90012"/>
    <!-- Blue stripe -->
    <path d="M 322 194 C 352 184 377 204 407 194 L 407 226 C 377 236 352 216 322 226 Z" fill="#0033A0"/>
    <!-- Orange stripe -->
    <path d="M 322 226 C 352 216 377 236 407 226 L 407 258 C 377 268 352 248 322 258 Z" fill="#F2A800"/>
  </g>

  <!-- Central Crest Ornament -->
  <circle cx="256" cy="245" r="22" fill="#020617" stroke="url(#gold)" stroke-width="4"/>
  <path d="M 256 230 L 261 242 L 273 243 L 264 251 L 267 262 L 256 256 L 245 262 L 248 251 L 239 243 L 251 242 Z" fill="url(#gold)"/>

  <!-- Organization Typography -->
  <text x="256" y="390" text-anchor="middle" fill="#fbbf24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    INDO ARMENIA LLC
  </text>
  <text x="256" y="425" text-anchor="middle" fill="#93c5fd" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="19" letter-spacing="6">
    GLOBAL PARTNERSHIP
  </text>
  <text x="256" y="455" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="14" opacity="0.8">
    Maro Margaryan 14, Yerevan
  </text>
</svg>
